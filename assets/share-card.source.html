<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    background:#a41034; color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    padding:86px 92px; display:flex; flex-direction:column; justify-content:space-between;
    -webkit-font-smoothing:antialiased;
  }
  .eyebrow { font-size:23px; letter-spacing:.26em; text-transform:uppercase; color:rgba(255,255,255,.75); }
  h1 { font-size:104px; font-weight:400; line-height:.96; letter-spacing:-.035em; }
  h1 span { color:rgba(255,255,255,.62); }
  .foot { display:flex; justify-content:space-between; align-items:flex-end; gap:40px;
          border-top:1px solid rgba(255,255,255,.32); padding-top:28px; }
  .foot p { font-size:27px; line-height:1.35; color:rgba(255,255,255,.86); max-width:24ch; }
  .foot .mark { font-size:21px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.75); white-space:nowrap; }
</style></head><body>
  <p class="eyebrow">HBS Class of 2028</p>
  <h1>Backed by the class.<br><span>Built for the class.</span></h1>
  <div class="foot">
    <p>A class fund at Harvard Business School.</p>
    <p class="mark">Twenty28 Ventures</p>
  </div>
</body></html>
